name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      # Includes deterministic evaluation/gate regressions, not live LLM quality.
      - run: python -m pytest -q --junitxml=outputs/validation/ci-regression.xml
      - run: python -m compileall -q src
      - run: PYTHONPATH=src:. python -m scripts.maintenance.verify_public_metrics
